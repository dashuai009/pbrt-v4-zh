name: Book checks
on:
  pull_request:
    branches: [main]
  workflow_call:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: tooling/package-lock.json
      - run: npm ci --prefix tooling --ignore-scripts
      - name: Install pinned compilers
        run: bash tooling/install-tools.sh
      - name: Check content, compile three PDFs, build whole site, validate links
        run: bash tooling/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: book-pdfs
          path: output/*.pdf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-records
          path: |
            output/link-report.json
            output/rendered-content-report.json
            output/build-consistency.json
            audit/source-link-issues.json
